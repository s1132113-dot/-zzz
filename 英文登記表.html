<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文課未寫作業登記系統</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #f0f4f8;
      color: #333;
    }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    label { font-weight: bold; display: block; margin-bottom: 5px; color: #34495e; }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background-color: #3498db;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #2980b9; }
    .btn-record {
      background-color: #e74c3c;
      width: 100%;
      padding: 14px;
      font-size: 18px;
    }
    .btn-record:hover { background-color: #c0392b; }
    .btn-copy { background-color: #2ecc71; }
    .btn-copy:hover { background-color: #27ae60; }
    .btn-line { background-color: #06C755; }
    .btn-line:hover { background-color: #05b34c; }
    .btn-reset { background-color: #7f8c8d; }
    .btn-reset:hover { background-color: #636e72; }
    .btn-del-item {
      background-color: #ff7675;
      color: white;
      padding: 3px 8px;
      font-size: 12px;
      border-radius: 4px;
      margin-left: 8px;
    }
    .btn-del-item:hover { background-color: #d63031; }

    /* 學生選擇按鈕網格 */
    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding: 5px;
      border: 1px solid #eee;
      border-radius: 8px;
    }
    .student-btn {
      padding: 12px 8px;
      font-size: 15px;
      background-color: #ecf0f1;
      color: #2c3e50;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .student-btn.selected {
      background-color: #e74c3c;
      color: white;
      border-color: #c0392b;
    }
    .badge {
      display: inline-block;
      background: #34495e;
      color: white;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      margin-left: 4px;
    }
    .student-btn.selected .badge {
      background: white;
      color: #c0392b;
    }

    /* 統計表格 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th { background-color: #f8f9fa; color: #2c3e50; }
    .tag-count {
      background-color: #e74c3c;
      color: white;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .log-item {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <h1>📚 英文課未寫作業登記系統</h1>

  <!-- 1. 基本設定 -->
  <div class="card">
    <h3>1. 登記資訊設定</h3>
    <div class="form-grid">
      <div>
        <label for="recorder">登記人員（老師/小老師）</label>
        <select id="recorder">
          <option value="黃子宸小老師 A">黃子宸小老師 A</option>
          <option value="曾子恆小老師 B">曾子恆小老師 B</option>
          <option value="林欣柔老師">林欣柔老師</option>
        </select>
      </div>
      <div>
        <label for="recordDate">登記日期</label>
        <input type="date" id="recordDate">
      </div>
      <div>
        <label for="hwName">缺交作業名稱</label>
        <input type="text" id="hwName" placeholder="例如：Unit 3 習作 p.12">
      </div>
    </div>
  </div>

  <!-- 2. 點名登記區 -->
  <div class="card">
    <h3>2. 勾選這次「未寫」的同學（點一下變紅）</h3>
    <div id="studentGrid" class="student-grid"></div>
    <br>
    <button class="btn-record" onclick="submitRecord()">📥 確認送出這筆登記</button>
  </div>

  <!-- 3. 統計與紀錄歷史 -->
  <div class="card">
    <h3>3. 目前未寫項目總統計</h3>
    <div class="action-buttons" style="margin-bottom: 15px;">
      <button class="btn-copy" onclick="copySummary()">📋 複製總統計文字</button>
      <button class="btn-line" onclick="sendLineSummary()">💬 發送統計至 LINE</button>
      <button class="btn-reset" onclick="resetAllData()">⚠️ 清空所有歷史紀錄</button>
    </div>
    
    <table>
      <thead>
        <tr>
          <th style="width: 20%;">學生姓名/座號</th>
          <th style="width: 15%;">被登記項數</th>
          <th style="width: 65%;">詳細未交紀錄 (可個別刪除)</th>
        </tr>
      </thead>
      <tbody id="statTableBody">
        <tr><td colspan="3" style="text-align:center; color:#888;">尚無任何缺交紀錄</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // 預設學生名單
    const studentNames = [    "01 韓喬安","02 林依靜","03 吳淯綺","04 王婕娜","05 李宥萱","07 劉羽真","08 鄭湘蓉","09 黃彥錡","10 莊采蓁","11 陳思羽","12 黃心瑀","13 林羽蘋","14 陳巧柔","15 黃翊慈","16 金芸睿","17 陳建均","18 王聖文","19 趙浤程","20 黃子宸","21 陳予澤","22 林威宇","23 宋緯濠","24 曾子恆","25 鄭丞傑","26 陳富家"];
    
    // 資料結構
    let records = {};
    function initRecords() {
      studentNames.forEach(name => {
        records[name] = { count: 0, logs: [] };
      });
    }
    initRecords();

    let selectedThisTime = new Set();

    // 初始化頁面
    window.onload = function() {
      document.getElementById('recordDate').value = new Date().toISOString().substring(0, 10);
      renderStudentGrid();
    };

    // 渲染學生按鈕
    function renderStudentGrid() {
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';

      studentNames.forEach(name => {
        const btn = document.createElement('div');
        const count = records[name].count;
        const isSelected = selectedThisTime.has(name);

        btn.className = `student-btn ${isSelected ? 'selected' : ''}`;
        btn.innerHTML = `${name} <span class="badge">累計:${count}</span>`;
        btn.onclick = () => toggleSelect(name);
        grid.appendChild(btn);
      });
    }

    // 切換選取狀態
    function toggleSelect(name) {
      if (selectedThisTime.has(name)) {
        selectedThisTime.delete(name);
      } else {
        selectedThisTime.add(name);
      }
      renderStudentGrid();
    }

    // 送出本次登記
    function submitRecord() {
      const recorder = document.getElementById('recorder').value;
      const date = document.getElementById('recordDate').value;
      const hwName = document.getElementById('hwName').value.trim();

      if (!hwName) {
        alert('請先填寫「缺交作業名稱」！');
        return;
      }

      if (selectedThisTime.size === 0) {
        alert('請至少選擇一位未寫作業的同學！');
        return;
      }

      selectedThisTime.forEach(name => {
        records[name].count += 1;
        records[name].logs.push({
          date: date,
          hw: hwName,
          recorder: recorder
        });
      });

      alert(`成功登記！共有 ${selectedThisTime.size} 位同學被登記「${hwName}」`);

      selectedThisTime.clear();
      document.getElementById('hwName').value = '';
      
      renderStudentGrid();
      renderTable();
    }

    // 刪除單筆紀錄
    function deleteSingleLog(name, logIndex) {
      if (confirm(`確定要刪除 ${name} 的這筆缺交紀錄嗎？`)) {
        records[name].logs.splice(logIndex, 1);
        records[name].count -= 1;
        renderStudentGrid();
        renderTable();
      }
    }

    // 清空所有資料
    function resetAllData() {
      if (confirm('確定要「清空所有同學」的缺交紀錄嗎？此動作無法復原喔！')) {
        initRecords();
        selectedThisTime.clear();
        renderStudentGrid();
        renderTable();
      }
    }

    // 更新統計表格
    function renderTable() {
      const tbody = document.getElementById('statTableBody');
      tbody.innerHTML = '';

      let hasData = false;

      studentNames.forEach(name => {
        const data = records[name];
        if (data.count > 0) {
          hasData = true;
          const tr = document.createElement('tr');
          
          // 組合包含「刪除按鈕」的單筆紀錄
          let logDetailsHTML = '';
          data.logs.forEach((l, index) => {
            logDetailsHTML += `
              <div class="log-item">
                <span>• [${l.date}] ${l.hw} (${l.recorder}記)</span>
                <button class="btn-del-item" onclick="deleteSingleLog('${name}', ${index})">🗑️ 刪除此筆</button>
              </div>
            `;
          });

          tr.innerHTML = `
            <td><b>${name}</b></td>
            <td><span class="tag-count">${data.count} 項</span></td>
            <td>${logDetailsHTML}</td>
          `;
          tbody.appendChild(tr);
        }
      });

      if (!hasData) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">尚無任何缺交紀錄</td></tr>';
      }
    }

    // 產生文字總結
    function generateSummaryText() {
      let text = `📢 【英文作業未交累計統計】\n`;
      let hasData = false;

      studentNames.forEach(name => {
        const data = records[name];
        if (data.count > 0) {
          hasData = true;
          text += `\n👤 ${name}（累計未交 ${data.count} 項）：\n`;
          data.logs.forEach(l => {
            text += `  └ ${l.date} - ${l.hw} (登記人:${l.recorder})\n`;
          });
        }
      });

      if (!hasData) {
        return `📢 【英文作業繳交狀況】\n目前全員皆無未交紀錄！🎉`;
      }

      return text;
    }

    // 複製統計文字
    function copySummary() {
      const text = generateSummaryText();
      navigator.clipboard.writeText(text).then(() => {
        alert('已複製缺交總統計文字到剪貼簿！');
      });
    }

    // 發送至 LINE
    function sendLineSummary() {
      const text = generateSummaryText();
      const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
      window.open(lineUrl, '_blank');
    }
  </script>

</body>
</html>
